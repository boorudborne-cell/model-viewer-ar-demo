<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Модель по маркеру</title>
  <link rel="stylesheet" href="style.css">
  <script src="libs/aframe.min.js"></script>
  <script src="libs/mindar-image-aframe.prod.js"></script>
</head>
<body class="ar-page">
  <a href="index.html" class="back-link">← Назад</a>
  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded color-space="sRGB" renderer="colorManagement: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="yarik" src="assets/yarik-ps2.glb"></a-asset-item>
    </a-assets>
    <a-light type="ambient" intensity="1.15"></a-light>
    <a-light type="directional" intensity="0.65" position="-1 2 2"></a-light>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#yarik" position="0 -0.13 0.25" scale="0.9 0.9 0.9"></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
