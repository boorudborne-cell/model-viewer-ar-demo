<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Маска на лице</title>
  <link rel="stylesheet" href="style.css">
  <script src="libs/aframe.min.js"></script>
  <script src="libs/mindar-face-aframe.prod.js"></script>
</head>
<body class="ar-page">
  <a href="index.html" class="back-link">← Назад</a>
  <a-scene
    mindar-face
    embedded color-space="sRGB" renderer="colorManagement: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="mask" src="assets/this-man-mask.glb"></a-asset-item>
    </a-assets>
    <a-light type="ambient" intensity="1.15"></a-light>
    <a-light type="directional" intensity="0.65" position="-1 2 2"></a-light>
    <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-face-target="anchorIndex: 1">
      <a-gltf-model src="#mask" position="0 0.16 0.13"></a-gltf-model>
    </a-entity>
  </a-scene>
</body>
</html>
