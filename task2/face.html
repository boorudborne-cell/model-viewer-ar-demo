<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>AR-маска на лице — Этот человек</title>
  <link rel="stylesheet" href="style.css">
  <script src="libs/aframe.min.js"></script>
  <script src="libs/mindar-face-aframe.prod.js"></script>
  <script src="ar-page.js" defer></script>
</head>
<body class="ar-page" data-mode="face">
  <main class="ar-stage">
    <a-scene
      mindar-face="autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true"
      vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets timeout="30000">
        <a-asset-item id="mask-model" src="assets/this-man-mask.glb"></a-asset-item>
      </a-assets>
      <a-light type="ambient" color="#ffffff" intensity="1.15"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.65" position="-1 2 2"></a-light>
      <a-camera active="false" position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-face-target="anchorIndex: 1">
        <a-gltf-model src="#mask-model" position="0 0.16 0.13" scale="1 1 1"></a-gltf-model>
      </a-entity>
    </a-scene>
  </main>
  <div class="ar-ui">
    <div class="ar-top"><a class="back-link" href="index.html">← Назад</a><strong>Маска на лице</strong></div>
    <div class="ar-bottom">
      <p>После запуска смотрите во фронтальную камеру. Чтобы навести камеру на другого человека, переключите её на заднюю.</p>
      <div class="ar-actions">
        <button id="start-ar" type="button" disabled>Включить камеру</button>
        <button id="stop-ar" type="button" class="secondary" hidden>Остановить</button>
        <button id="switch-camera" type="button" class="secondary" hidden>Сменить камеру</button>
      </div>
      <div id="ar-status" class="ar-status" role="status" aria-live="polite">Подготовка сцены…</div>
    </div>
  </div>
</body>
</html>
