<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Задание 5 — Three.js: управление объектом, HDRI, PBR, AR</title>

  <!-- Three.js r169 локально: голый спецификатор "three" и аддоны "three/addons/" -->
  <script type="importmap">
  {
    "imports": {
      "three": "./libs/three/three.module.js",
      "three/addons/": "./libs/three/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Канвас Three.js добавляется сюда (SceneStage) -->
  <div id="viewport"></div>

  <!--
    Панель управления. Корень dom-overlay — прозрачная обёртка #xr-overlay:
    в AR браузер растягивает корень на весь экран, поэтому сама панель им быть
    не может (иначе её фон с blur закроет камеру, а beforexrselect погасит все
    касания). beforexrselect в ControlPanel гасит тапы только по #panel.
  -->
  <div id="xr-overlay">
  <div id="panel">
    <div id="status" class="status" role="status">Запуск…</div>

    <div class="row">
      <button id="ar-start" class="btn primary grow" disabled>📱 Запустить AR</button>
      <button id="spin-toggle" class="icon-btn on" type="button"
              title="Автовращение" aria-pressed="true">⟳</button>
    </div>

    <div class="row">
      <div class="seg" id="model-tabs" role="group" aria-label="Модель">
        <button class="seg-btn on" type="button" data-model="Dollar-Coin">Dollar-Coin</button>
        <button class="seg-btn" type="button" data-model="Dollar-Coin-10RUB">Dollar-Coin-10RUB</button>
      </div>
    </div>

    <div class="row" id="swatches">
      <button class="swatch default on" type="button" data-color="" title="Из материала модели"></button>
      <button class="swatch" type="button" data-color="#ffd54a" style="--c:#ffd54a" title="Золото"></button>
      <button class="swatch" type="button" data-color="#d9dde2" style="--c:#d9dde2" title="Серебро"></button>
      <button class="swatch" type="button" data-color="#c47a3d" style="--c:#c47a3d" title="Медь"></button>
      <button class="swatch" type="button" data-color="#e04fa0" style="--c:#e04fa0" title="Розовый"></button>
      <input type="color" id="custom-color" class="swatch custom" value="#7c5cff" title="Свой цвет" />
    </div>

    <details id="advanced">
      <summary>Настройки</summary>

      <div class="row">
        <button id="rot-l" class="chip btn" type="button">⟲ 45°</button>
        <button id="rot-r" class="chip btn" type="button">⟳ 45°</button>
        <button id="mat-reset" class="chip btn" type="button">↺ Материал</button>
      </div>

      <div class="row">
        <select id="hdri" class="chip">
          <option value="./assets/environments/spruit_sunrise_1k.hdr">HDRI: Рассвет</option>
          <option value="./assets/environments/whipple_creek_1k.hdr">HDRI: Лес</option>
          <option value="./assets/environments/music_hall_01_1k.hdr">HDRI: Концертный зал</option>
          <option value="room">Комната (без HDRI)</option>
        </select>
        <label class="chip" id="sky-chip"><input type="checkbox" id="skybox"> HDRI-фон</label>
      </div>

      <div class="sliders">
        <label class="exp">Свет <input type="range" id="exposure" min="0.2" max="2.5" step="0.05" value="1"></label>
        <label class="exp">Metal <input type="range" id="metalness" min="0" max="1" step="0.05" value="1"></label>
        <label class="exp">Rough <input type="range" id="roughness" min="0" max="1" step="0.05" value="1"></label>
      </div>
    </details>

    <div class="row" id="ar-controls" hidden>
      <button id="ar-clear" class="btn chip" type="button">Очистить</button>
      <button id="ar-stop" class="btn chip" type="button">Выйти из AR</button>
    </div>

    <p class="hint" id="hint">AR — Chrome на Android с ARCore. Наведите камеру на пол и коснитесь его: монета встанет на поверхность.</p>
  </div>
  </div>

  <script type="module" src="./src/main.js?v=2"></script>
</body>
</html>
