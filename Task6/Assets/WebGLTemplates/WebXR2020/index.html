<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Task 6 — WebAR | {{{ PRODUCT_NAME }}}</title>
  <meta name="description" content="{{{ DESCRIPTION }}}" />
  <link rel="shortcut icon" href="TemplateData/favicon.ico" />
  <style>
    :root { --bg:#0a0f18; --accent:#4f8cff; --accent2:#7c5cff; --text:#e8edf6; --muted:#93a0b4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
    #unity-canvas { display: block; width: 100vw; height: 100vh;
      background: radial-gradient(1100px 520px at 80% -10%, rgba(124,92,255,.22), transparent 60%),
                  radial-gradient(900px 480px at -10% 30%, rgba(79,140,255,.18), transparent 55%),
                  linear-gradient(180deg, #131a2c, #0a0f18); }
    #unity-loading-bar { position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: var(--bg); z-index: 20; }
    #unity-logo { width: 46px; height: 46px; border-radius: 50%;
      background: conic-gradient(from 200deg, var(--accent), var(--accent2), var(--accent));
      animation: spin 1.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #unity-progress-bar-empty { width: 240px; max-width: 60vw; height: 8px; border-radius: 4px;
      background: rgba(255,255,255,.14); overflow: hidden; }
    #unity-progress-bar-full { width: 0; height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .2s; }
    #loading-text { color: var(--muted); font-size: 13px; }

    /* Верхняя плашка */
    #hud-top { position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: linear-gradient(rgba(6,9,16,.78), transparent); pointer-events: none; z-index: 10; }
    #hud-top .title { font-size: 13px; font-weight: 600; letter-spacing: .3px; }
    #hud-top .title small { color: var(--muted); font-weight: 400; }
    #ar-state { font-size: 11.5px; color: var(--muted); padding: 5px 10px; border-radius: 999px;
      background: rgba(13,18,32,.75); border: 1px solid rgba(255,255,255,.1); }
    #ar-state.ok { color: #b9f5d8; border-color: rgba(57,217,138,.45); }
    #ar-state.warn { color: #ffe1a8; border-color: rgba(245,184,61,.45); }

    /* Нижняя панель */
    #unity-footer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
      padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      background: linear-gradient(transparent, rgba(6,9,16,.88)); }
    #enterar { min-height: 52px; padding: 14px 34px; border: 0; border-radius: 999px;
      color: #fff; font: 600 16px/1 "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 12px 34px rgba(79,140,255,.45); cursor: pointer; }
    #enterar:disabled { opacity: .45; box-shadow: none; cursor: not-allowed; }
    #enterar:active { transform: scale(.98); }
    #entervr, #unity-webgl-logo, #unity-build-title, #unity-webxr-link { display: none; }
    .hint { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.45; max-width: 520px; margin: 0; }
    body.in-ar #hud-top .title small { display: none; }
    body.in-ar #unity-footer { background: none; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    body.in-ar .hint { display: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>

  <div id="unity-loading-bar">
    <div id="unity-logo"></div>
    <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    <div id="loading-text">Загрузка WebGL-сцены…</div>
  </div>

  <div id="hud-top">
    <div class="title">Task 6 · Unity WebXR <small>— объект в viewer-space</small></div>
    <div id="ar-state">AR: проверка…</div>
  </div>

  <div id="unity-footer">
    <button id="entervr" disabled>VR</button>
    <button id="enterar" disabled>Войти в AR</button>
    <p class="hint" id="hint">Откройте страницу по HTTPS в Chrome на Android (ARCore). После входа в AR камера телефона покажет комнату, а куб будет висеть в центре поля зрения.</p>
  </div>

  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}"
    };

    var unityInstance = null;
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var arButton = document.getElementById("enterar");
    var arState = document.getElementById("ar-state");
    var hint = document.getElementById("hint");

    {{{ WEBXR_POLYFILL_CONFIG }}}

    loadingBar.style.display = "flex";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (instance) {
        unityInstance = instance;
        loadingBar.style.display = "none";
      }).catch(function (message) {
        loadingBar.querySelector("#loading-text").textContent = "Ошибка загрузки: " + message;
      });
    };
    document.body.appendChild(script);

    document.addEventListener("onARSupportedCheck", function (event) {
      var supported = !!(event.detail && event.detail.supported);
      arButton.disabled = !supported;
      arState.textContent = supported ? "AR поддерживается" : "AR не поддерживается";
      arState.className = supported ? "ok" : "warn";
      hint.textContent = supported
        ? "Нажмите «Войти в AR»: камера покажет комнату, объект будет висеть в центре поля зрения. Повторное нажатие выходит из AR."
        : "AR недоступна: нужен Chrome на Android с ARCore и HTTPS. 3D-сцена доступна без AR.";
    }, false);

    arButton.addEventListener("click", function () {
      if (!unityInstance) return;
      unityInstance.Module.WebXR.toggleAR();
      var entering = arButton.textContent !== "Выйти из AR";
      arButton.textContent = entering ? "Выйти из AR" : "Войти в AR";
      document.body.classList.toggle("in-ar", entering);
    }, false);
  </script>
</body>
</html>
