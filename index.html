<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Монета в 3D и AR</title>
  <script type="module" src="libs/model-viewer.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; text-align: center; }
    model-viewer { display: block; width: 100%; max-width: 800px; height: 70vh; min-height: 350px; margin: 20px auto; background: #eee; }
    #ar-button { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 12px 18px; font: inherit; }
  </style>
</head>
<body>
  <h1>Монета в 3D и AR</h1>
  <p>Поворачивайте монету пальцем. На телефоне нажмите «Посмотреть в AR».</p>

  <model-viewer
    src="assets/models/Dollar-Coin.glb?v=3"
    alt="3D-модель монеты Dollar Coin"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    camera-controls
    touch-action="pan-y"
    camera-orbit="40deg 25deg auto"
    environment-image="assets/environments/spruit_sunrise_1k.hdr"
    shadow-intensity="0.5">
    <button id="ar-button" slot="ar-button">Посмотреть в AR</button>
  </model-viewer>
</body>
</html>
